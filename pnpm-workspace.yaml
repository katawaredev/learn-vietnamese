allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  onnxruntime-node: false
  protobufjs: true
  sharp: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3
  vite-plus: 1.1.0
  "@vitest/browser-playwright": 5.0.3
minimumReleaseAgeExclude:
  - effect@4.0.2
  - "@tanstack/ai@0.66.0"
  - "@tanstack/ai-client@0.39.0"
  - "@tanstack/ai-openai@0.28.0"
  - "@tanstack/ai-react@0.30.1"
  - baseline-browser-mapping@2.11.28
  - lucide-react@1.53.0
  - "@tanstack/openai-base@0.12.6"
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
